<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Recoup — payment-failure recovery for Indian payment rails. The LLM proposes, a policy engine disposes, and a built-in holdout proves the recovery is real."
    />
    <!-- Follows the palette's --bg in each scheme so the browser chrome does
         not flash the opposite theme before first paint. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0e1c" />

    <!-- Inter — Blade's own text/display face (read from
         fontFamily.web.ts). Mono is a system stack (Blade ships no mono
         webfont), so only one family loads over the network. Preconnect to
         both hosts: the CSS comes from googleapis, the font file from
         gstatic, and without the second hint the font fetch pays a fresh
         connection setup. `display=swap` (and the system fallback stack in
         styles/index.css) means text is readable on first paint rather than
         invisible — a FOIT on a projector during a judged demo is worse
         than a FOUT. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <title>Recoup — payment recovery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
